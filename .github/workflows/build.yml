name: Build AdStripper APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sources
        run: bash gen.sh AdStripper

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build APK
        run: gradle -p AdStripper assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdStripper-APK
          path: AdStripper/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdStripper-sources-zip
          path: AdStripper.zip

      - name: Commit sources back to repo
        run: |
          git config user.name "adstripper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add AdStripper
          git diff --cached --quiet || git commit -m "Add AdStripper sources [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
